<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="utf-8">

    <title>Calculator</title>

    <meta
        name="description"
        content="A basic calculator using vanilla JavaScript"
    >

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <link rel="stylesheet" href="styles.css">
</head>


<body>

    <main class="calculator">

        <div class="display">0</div>


        <div class="buttons-section">

            <!-- Row 1 -->

            <div class="button-row">

                <button
                    class="action"
                    data-action="all-clear"
                >
                    AC
                </button>

                <button
                    class="action"
                    data-action="sign"
                >
                    +/-
                </button>

                <button
                    class="action"
                    data-action="percent"
                >
                    %
                </button>

                <button
                    class="operator"
                    data-operation="divide"
                >
                    ÷
                </button>

            </div>


            <!-- Row 2 -->

            <div class="button-row">

                <button
                    class="number"
                    data-value="7"
                >
                    7
                </button>

                <button
                    class="number"
                    data-value="8"
                >
                    8
                </button>

                <button
                    class="number"
                    data-value="9"
                >
                    9
                </button>

                <button
                    class="operator"
                    data-operation="multiply"
                >
                    ×
                </button>

            </div>


            <!-- Row 3 -->

            <div class="button-row">

                <button
                    class="number"
                    data-value="4"
                >
                    4
                </button>

                <button
                    class="number"
                    data-value="5"
                >
                    5
                </button>

                <button
                    class="number"
                    data-value="6"
                >
                    6
                </button>

                <button
                    class="operator"
                    data-operation="subtract"
                >
                    -
                </button>

            </div>


            <!-- Row 4 -->

            <div class="button-row">

                <button
                    class="number"
                    data-value="1"
                >
                    1
                </button>

                <button
                    class="number"
                    data-value="2"
                >
                    2
                </button>

                <button
                    class="number"
                    data-value="3"
                >
                    3
                </button>

                <button
                    class="operator"
                    data-operation="add"
                >
                    +
                </button>

            </div>


            <!-- Row 5 -->

            <div class="button-row">

                <button
                    class="number zero"
                    data-value="0"
                >
                    0
                </button>

                <button
                    class="number"
                    data-value="."
                >
                    .
                </button>

                <button
                    class="action"
                    data-action="clear"
                >
                    C
                </button>

                <button
                    class="equals"
                    data-action="equals"
                >
                    =
                </button>

            </div>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
